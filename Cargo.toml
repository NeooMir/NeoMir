[package]
name = "neomir"
version = "1.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Modern educational programming environment for KuMir algorithmic language with Robot performer"
repository = "https://github.com/neoomir/neomir"

[dependencies]
adw = { package = "libadwaita", version = "0.7", features = ["v1_5"] }
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
glib = "0.20"
pango = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tar = "0.4"
flate2 = "1.0"
directories = "5.0"
libc = "0.2"

[dev-dependencies]
tempfile = "3.17"
