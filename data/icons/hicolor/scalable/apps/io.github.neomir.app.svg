<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="robot_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea"/>
      <stop offset="100%" stop-color="#1c71d8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base rounded tile -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="#f6f8fa" stroke="#d5dbe5" stroke-width="2"/>

  <!-- Field grid lines -->
  <path d="M 28 8 L 28 120 M 48 8 L 48 120 M 68 8 L 68 120 M 88 8 L 88 120 M 108 8 L 108 120" stroke="#e1e6ee" stroke-width="1.5"/>
  <path d="M 8 28 L 120 28 M 8 48 L 120 48 M 8 68 L 120 68 M 8 88 L 120 88 M 8 108 L 120 108" stroke="#e1e6ee" stroke-width="1.5"/>

  <!-- Painted cell -->
  <rect x="48" y="68" width="40" height="40" fill="#8ff0a4" opacity="0.6"/>
  <path d="M 48 88 L 68 68 M 48 108 L 88 68 M 68 108 L 88 88" stroke="#26a269" stroke-width="2" opacity="0.6"/>

  <!-- Walls -->
  <path d="M 48 68 L 88 68" stroke="#241f31" stroke-width="4" stroke-linecap="round"/>
  <path d="M 88 68 L 88 108" stroke="#241f31" stroke-width="4" stroke-linecap="round"/>

  <!-- Robot Diamond -->
  <g filter="url(#shadow)">
    <polygon points="64,28 92,56 64,84 36,56" fill="url(#robot_grad)" stroke="#1a5fb4" stroke-width="3"/>
    <!-- Robot Eye -->
    <circle cx="64" cy="56" r="11" fill="#ffffff"/>
    <circle cx="64" cy="56" r="5" fill="#241f31"/>
    <circle cx="66" cy="54" r="1.5" fill="#ffffff"/>
  </g>
</svg>
